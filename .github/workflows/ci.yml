name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install` (not `npm ci`): the lockfile is generated on macOS and
      # omits Linux-only WASM peer deps (@emnapi/* via @napi-rs/wasm-runtime),
      # which makes strict `npm ci` fail on the Linux runner. `npm install`
      # backfills them at install time.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # CI never checked formatting, so 25 files drifted before anyone noticed.
      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Eight staging accounts, four lanes of two. A run picks its lane from
  # run_id mod 4 — deterministic per run, no coordination between branches —
  # so up to four PRs' e2e can be in flight at once instead of serializing
  # behind a single pair of accounts. Within a lane, the suite still splits
  # by time (screens.spec alone, the rest beside it) across its two accounts,
  # so one PR's own run is no slower than the old two-account design.
  pick-lane:
    runs-on: ubuntu-latest
    outputs:
      idx1: ${{ steps.pick.outputs.idx1 }}
      idx2: ${{ steps.pick.outputs.idx2 }}
    steps:
      - id: pick
        run: |
          LANE=$(( ${{ github.run_id }} % 4 ))
          echo "idx1=$(( LANE * 2 + 1 ))" >> "$GITHUB_OUTPUT"
          echo "idx2=$(( LANE * 2 + 2 ))" >> "$GITHUB_OUTPUT"

  e2e-shard:
    name: e2e shard ${{ matrix.shard }}
    needs: pick-lane
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # One queue per account: two runs on the same account would trip over each
    # other. Queue rather than cancel — a cancelled run can leave it mid-test.
    concurrency:
      group: e2e-staging-${{ matrix.shard == 1 && needs.pick-lane.outputs.idx1 || needs.pick-lane.outputs.idx2 }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Secrets are not exposed to pull requests from forks, so the suite has to
      # be able to stand down. It says so loudly rather than reporting a green
      # check for a run that tested nothing. `idx` (1..8) is this shard's account
      # in its lane; account 1 keeps the unsuffixed secret names from before
      # sharding existed, 2..8 are `_N`.
      - name: Check E2E configuration
        id: config
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          IDX: ${{ matrix.shard == 1 && needs.pick-lane.outputs.idx1 || needs.pick-lane.outputs.idx2 }}
          ACCOUNT_EMAIL: ${{ (matrix.shard == 1 && needs.pick-lane.outputs.idx1 || needs.pick-lane.outputs.idx2) == '1' && secrets.E2E_EMAIL || secrets[format('E2E_EMAIL_{0}', matrix.shard == 1 && needs.pick-lane.outputs.idx1 || needs.pick-lane.outputs.idx2)] }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -z "$E2E_SUPABASE_URL" ] || [ -z "$ACCOUNT_EMAIL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E skipped::E2E_SUPABASE_URL / account $IDX email are not set, so no browser test ran."
            echo "### E2E skipped — secrets not available to this run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            # Split by time: the screenshot walk on its own, everything else beside it.
            if [ "$SHARD" = "1" ]; then echo "part=rest" >> "$GITHUB_OUTPUT"; else echo "part=screens" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Install dependencies
        if: steps.config.outputs.run == 'true'
        run: npm install --no-audit --no-fund

      # `.env.e2e.local` beats `.env.local` in Vite's precedence, so `--mode e2e`
      # pins the dev server to the staging project. Production must never be the
      # target: these specs write real rows.
      - name: Write E2E environment
        if: steps.config.outputs.run == 'true'
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.E2E_SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.E2E_SUPABASE_ANON_KEY }}"
          } > .env.e2e.local

      - name: Install Playwright browser
        if: steps.config.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      # Each shard signs in as its own account; the specs only ever read
      # E2E_EMAIL / E2E_PASSWORD, so they need no idea which one.
      - name: E2E tests
        if: steps.config.outputs.run == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ (matrix.shard == 1 && needs.pick-lane.outputs.idx1 || needs.pick-lane.outputs.idx2) == '1' && secrets.E2E_EMAIL || secrets[format('E2E_EMAIL_{0}', matrix.shard == 1 && needs.pick-lane.outputs.idx1 || needs.pick-lane.outputs.idx2)] }}
          E2E_PASSWORD: ${{ (matrix.shard == 1 && needs.pick-lane.outputs.idx1 || needs.pick-lane.outputs.idx2) == '1' && secrets.E2E_PASSWORD || secrets[format('E2E_PASSWORD_{0}', matrix.shard == 1 && needs.pick-lane.outputs.idx1 || needs.pick-lane.outputs.idx2)] }}
          E2E_PART: ${{ steps.config.outputs.part }}
        run: npm run test:e2e

      - name: Upload screenshots
        if: always() && steps.config.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screens-shard-${{ matrix.shard }}
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces
        if: failure() && steps.config.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The one check named `e2e`, as before: green only when every shard is, and
  # the place the shards' screenshots come back together as one `screens`
  # artifact for `gh run download -n screens`.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - name: Shards passed
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "::error::an e2e shard did not pass (${{ needs.e2e-shard.result }})"
            exit 1
          fi

      - name: Merge screenshots
        uses: actions/upload-artifact/merge@v4
        with:
          name: screens
          pattern: screens-shard-*
          delete-merged: true
        continue-on-error: true
