<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Kept in sync with the app's own theme (not the OS scheme) by
         applyTheme — a coffee canvas under dark browser chrome looks broken
         once the app is installed and the chrome is all you see. -->
    <meta name="theme-color" content="#1B1B1D" />
    <!-- iOS ignores the manifest's display mode; this is what makes an
         added-to-home-screen Almanac open without Safari's chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Almanac" />
    <meta
      name="description"
      content="Almanac — a personal command-center for habits, workouts, and self-discipline."
    />
    <title>Almanac</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
